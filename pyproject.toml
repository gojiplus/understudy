[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "understudy"
version = "0.5.0"
description = "Simulation and trace-based evaluation for agentic systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Gaurav Sood" },
]
keywords = ["agent", "evaluation", "simulation", "testing", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.50",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0", "python-dotenv>=1.0"]
http = ["httpx>=0.27"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.3"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
reports = ["jinja2>=3.0", "click>=8.0"]
all = ["understudy[adk,http,langgraph,server,reports]"]

[project.scripts]
understudy = "understudy.cli:main"

[project.entry-points.pytest11]
understudy = "understudy.pytest_plugin"

[project.urls]
Homepage = "https://github.com/gojiplus/understudy"
Documentation = "https://gojiplus.github.io/understudy"
Repository = "https://github.com/gojiplus/understudy"
Issues = "https://github.com/gojiplus/understudy/issues"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S108: "/tmp/..." strings in tests are inert fixture data, never opened.
"tests/**" = ["S101", "D", "ARG", "SLF", "S108"]
"docs/**" = ["D"]
# Runnable demo scripts: asserts and prints are their idiom, unused callback
# arguments mirror the framework signatures they demonstrate, and mock tool
# handlers must reuse the tool's own argument names (`format` included)
# because mocks are invoked with keyword arguments from the scene.
"examples/**" = ["S101", "T20", "D", "ARG", "A002"]
# Request/response models mirror the UI client's camelCase wire schema.
"src/understudy/server/models.py" = ["N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[dependency-groups]
# Development concerns, not user-facing optional features -- extras are for
# what a consumer might install, and nobody installs understudy to build its
# docs. CI syncs `--all-extras --all-groups`.
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    { include-group = "test" },
    { include-group = "docs" },
    "pyright>=1.1.390",
    "pydoclint>=0.5",
]
