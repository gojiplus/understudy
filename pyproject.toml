[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[project]
name = "understudy"
version = "0.5.0"
description = "Simulation and trace-based evaluation for agentic systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Gaurav Sood" },
]
keywords = ["agent", "evaluation", "simulation", "testing", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.50",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0", "python-dotenv>=1.0"]
http = ["httpx>=0.27"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.3"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
reports = ["jinja2>=3.0", "click>=8.0"]
all = ["understudy[adk,http,langgraph,server,reports]"]

[project.scripts]
understudy = "understudy.cli:main"

[project.entry-points.pytest11]
understudy = "understudy.pytest_plugin"

[project.urls]
Homepage = "https://github.com/gojiplus/understudy"
Documentation = "https://gojiplus.github.io/understudy"
Repository = "https://github.com/gojiplus/understudy"
Issues = "https://github.com/gojiplus/understudy/issues"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
# The standard's scope: the shipped package. Unscoped, pyright reported 54
# errors here and 32 of them were in tests/, where mocks and fixtures are
# deliberately loose -- which buried the 22 in code users actually run.
include = ["src"]
typeCheckingMode = "standard"

[dependency-groups]
# Development concerns, not user-facing optional features -- extras are for
# what a consumer might install, and nobody installs understudy to build its
# docs. CI syncs `--all-extras --all-groups`.
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "sphinx-autodoc-typehints>=2.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    { include-group = "test" },
    { include-group = "docs" },
]
