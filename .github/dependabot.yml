version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    ignore:
      # google-adk 2.12 requires OpenTelemetry <=1.42.1; FastAPI needs >=1.44.
      # Remove this bound when ADK supports the newer OpenTelemetry release.
      - dependency-name: "fastapi"
        versions: [">=0.142.0"]
    # Dependabot's default keeps only the dependencies pyproject.toml names
    # current; everything they pull in sits in uv.lock untouched until an
    # advisory or an upstream floor forces the issue (reporoulette carried
    # grpcio 1.76 for eleven months). The grouped weekly PR absorbs the churn.
    allow:
      - dependency-type: "all"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
